name: Deploy board preview

# Pushes this branch to a stable Firebase Hosting preview channel so the
# new board can be opened in a browser without merging to main.
# URL: https://quoridor-440a4--board-preview.web.app
on:
  push:
    branches:
      - cursor/improve-3d-board-visuals-99a5
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUORIDOR_440A4 }}'
          projectId: quoridor-440a4
          channelId: board-preview
          expires: 30d
